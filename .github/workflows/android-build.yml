# Compile check only — this is deliberately NOT the release path. It assembles a debug APK;
# the release AAB that goes to Play is built by hand, because signing comes from a gitignored
# local.properties that no runner has. See tfi-app/docs/PLAY_RELEASE.md.
name: Android Build

on:
  push:
    branches: ["**"]        # build on every branch push
    paths-ignore:           # ...except docs-only changes — nothing here is a build input
      - "**.md"
      - "static/**"
  pull_request:
    branches: ["master"]
    paths-ignore:
      - "**.md"
      - "static/**"
  workflow_dispatch:        # allow manual runs from the Actions tab

# Cancel an in-progress run if you push again to the same branch/PR
concurrency:
  group: android-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Assemble debug APK
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: tfi-app   # the project lives in a subdir, not repo root

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
          # Caching is handled by gradle/actions/setup-gradle below, not here.

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        # Caches the whole Gradle User Home (~/.gradle): downloaded dependencies,
        # the wrapper, AND the build cache (task outputs). Its key strategy restores
        # the most recent cache on this branch, falling back to the default branch —
        # so a branch build inherits master's cache (the "parent commit"). By default
        # it only WRITES caches from the default branch, keeping branch runs from
        # polluting the shared cache.

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        # installs cmdline-tools + accepts licenses. compileSdk/buildTools
        # (34) are resolved by Gradle from app/build.gradle automatically.

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Assemble debug APK
        run: ./gradlew :app:assembleDebug --build-cache --no-daemon --stacktrace
        # --build-cache reuses unchanged task outputs from the restored cache.
        # No JAVA_HOME override needed: setup-java sets JAVA_HOME on the runner.
        # No signing config required for the debug variant (debug keystore).

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: app-debug-apk
          path: tfi-app/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
