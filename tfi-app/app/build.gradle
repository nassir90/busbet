plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
    id 'org.jetbrains.kotlin.plugin.compose'
    id 'io.github.takahirom.roborazzi'
}

// Read secrets from local.properties (gitignored) so they're never committed.
def localProps = new Properties()
def localPropsFile = rootProject.file('local.properties')
if (localPropsFile.exists()) localPropsFile.withInputStream { localProps.load(it) }

android {
    namespace 'iompar.mpts.ie'
    compileSdk 36

    defaultConfig {
        applicationId "iompar.mpts.ie"
        minSdk 24
        targetSdk 36
        // Bumped once per ticket implemented, not once per release: Sentry groups events by
        // release, so a version that only moves when someone remembers to move it puts weeks of
        // unrelated builds into one bucket and makes "did that fix land?" unanswerable.
        versionCode 12
        versionName "1.11"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"

        // Backend URLs are no longer build constants — they're runtime config, editable from
        // Settings without a rebuild. See BackendConfig.kt (DEFAULT_BACKEND_ROOT) for the default.

        // Sentry DSN — set `sentry.dsn=...` in local.properties to enable crash/error
        // reporting. Empty by default, which makes the Sentry SDK a no-op.
        buildConfigField "String", "SENTRY_DSN", "\"${localProps.getProperty('sentry.dsn', '')}\""
    }

    // Upload key for Play. Everything comes from local.properties (gitignored) so neither the
    // keystore nor its passwords are ever committed. Absent config isn't an error — debug builds
    // must keep working on a machine that has no signing material.
    def keystorePath = localProps.getProperty('release.storeFile', '')
    def hasReleaseSigning = !keystorePath.isEmpty() && rootProject.file(keystorePath).exists()

    signingConfigs {
        if (hasReleaseSigning) {
            release {
                storeFile rootProject.file(keystorePath)
                storePassword localProps.getProperty('release.storePassword')
                keyAlias localProps.getProperty('release.keyAlias')
                keyPassword localProps.getProperty('release.keyPassword')
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            if (hasReleaseSigning) {
                signingConfig signingConfigs.release
            } else {
                // Left unsigned deliberately rather than falling back to the debug key: a debug-signed
                // artifact is silently unpublishable, and finding that out at upload is worse than here.
                logger.lifecycle("No release signing config (set release.* in local.properties) — release build will be unsigned")
            }
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = '17'
    }
    testOptions {
        unitTests {
            includeAndroidResources = true
            all {
                maxHeapSize = '3g'
            }
        }
    }
    buildFeatures {
        compose true
        buildConfig true
    }
    // Compose compiler version is now governed by the org.jetbrains.kotlin.plugin.compose plugin
    // (Kotlin 2.0+), so the old composeOptions { kotlinCompilerExtensionVersion } block is gone.
}

dependencies {
    def composeBom = platform('androidx.compose:compose-bom:2024.09.03')
    implementation composeBom
    androidTestImplementation composeBom

    implementation 'androidx.core:core-ktx:1.13.1'
    implementation 'androidx.activity:activity-compose:1.9.2'
    implementation 'androidx.lifecycle:lifecycle-runtime-ktx:2.8.6'
    implementation 'androidx.lifecycle:lifecycle-viewmodel-compose:2.8.6'
    // LocalLifecycleOwner + repeatOnLifecycle from composition — used by PollEffect so the 30s
    // poll loops stop when the app is backgrounded instead of running until the process dies.
    implementation 'androidx.lifecycle:lifecycle-runtime-compose:2.8.6'

    implementation 'androidx.compose.ui:ui'
    implementation 'androidx.compose.ui:ui-tooling-preview'
    implementation 'androidx.compose.material3:material3'
    implementation 'androidx.compose.material:material-icons-extended'
    debugImplementation 'androidx.compose.ui:ui-tooling'

    implementation 'androidx.datastore:datastore-preferences:1.1.1'
    implementation 'com.google.android.material:material:1.12.0'
    implementation 'sh.calvin.reorderable:reorderable:2.4.3'

    implementation 'androidx.glance:glance-appwidget:1.1.0'
    implementation 'androidx.glance:glance-material3:1.1.0'

    implementation 'com.squareup.retrofit2:retrofit:2.11.0'
    implementation 'com.squareup.retrofit2:converter-gson:2.11.0'
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'

    implementation 'org.osmdroid:osmdroid-android:6.1.20'
    implementation 'androidx.work:work-runtime-ktx:2.9.1'

    implementation 'io.sentry:sentry-android:7.18.0'

    // On-device MCP server + HTTP API. The MCP SDK pulls Ktor 3.2.3 transitively; we pin all Ktor
    // artifacts to that exact version to avoid the known SSE binary-incompat NoSuchMethodError.
    implementation 'io.modelcontextprotocol:kotlin-sdk-server:0.10.0'
    implementation 'org.jetbrains.kotlinx:kotlinx-serialization-json:1.9.0'
    implementation 'io.ktor:ktor-server-core:3.2.3'
    implementation 'io.ktor:ktor-server-cio:3.2.3'
    implementation 'io.ktor:ktor-server-sse:3.2.3'
    implementation 'io.ktor:ktor-server-content-negotiation:3.2.3'
    // kotlinx-json (not gson) for ContentNegotiation: the MCP transport responds via call.respond
    // and needs McpJson's serializers. The /api routes serialize their Gson domain classes by hand.
    implementation 'io.ktor:ktor-serialization-kotlinx-json:3.2.3'

    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.jetbrains.kotlinx:kotlinx-coroutines-test:1.10.2'
    testImplementation 'io.ktor:ktor-server-test-host:3.2.3'

    testImplementation composeBom
    testImplementation 'androidx.compose.ui:ui-test-junit4'
    debugImplementation 'androidx.compose.ui:ui-test-manifest'
    testImplementation 'org.robolectric:robolectric:4.17'
    testImplementation 'io.github.takahirom.roborazzi:roborazzi:1.76.0'
    testImplementation 'io.github.takahirom.roborazzi:roborazzi-compose:1.76.0'
    testImplementation 'io.github.takahirom.roborazzi:roborazzi-junit-rule:1.76.0'
}
