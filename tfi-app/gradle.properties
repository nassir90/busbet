# Project-wide Gradle settings.
# IDE (e.g. Android Studio) users:
# Gradle settings configured through the IDE are ignored when building from the command line, check
# build.gradle files instead.

# When configured, Gradle will run in offline mode and will not attempt to access the network.
# org.gradle.offline=true

# AndroidX package structure to make it easier to discover and migrate existing, old-style packages
android.useAndroidX=true
org.gradle.jvmargs=-Xmx3g

# Reuse task outputs across builds (local + CI Gradle build cache) and build
# independent modules in parallel. The CI cache persists ~/.gradle between runs,
# so unchanged tasks are pulled from the cache instead of re-executed.
org.gradle.caching=true
org.gradle.parallel=true
