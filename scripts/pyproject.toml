[project]
name = "icon-tool"
version = "0.1.0"
description = "Android icon manager for tfi-app"
requires-python = ">=3.10"
dependencies = [
    "pygobject>=3.42.0",
]

[project.scripts]
icon-tool = "icon_tool.app:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["icon_tool"]
