// Top-level build file where you can add configuration options common to all sub-projects/modules.
plugins {
    id 'com.android.application' version '8.6.0' apply false
    id 'com.android.library' version '8.6.0' apply false
    // Bumped to 2.2.21: the MCP Kotlin SDK (io.modelcontextprotocol:kotlin-sdk-server) requires a
    // Kotlin 2.2.x stdlib. Kotlin 2.0+ moves the Compose compiler into its own Gradle plugin.
    id 'org.jetbrains.kotlin.android' version '2.2.21' apply false
    id 'org.jetbrains.kotlin.plugin.compose' version '2.2.21' apply false
    id 'io.github.takahirom.roborazzi' version '1.76.0' apply false
}
